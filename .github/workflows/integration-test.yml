name: Integration Tests

on:
  push:
    branches: [main, feat/paket-a-auth]
  pull_request:
    branches: [main, feat/paket-a-auth]

jobs:
  test-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Kredensial lokal khusus untuk container test di GitHub Actions
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Migration on Test Database
        # Ini memastikan skema 0_init dibangun secara deterministik, lalu update lainnya.
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Integration Tests
        run: npm run test:integration
