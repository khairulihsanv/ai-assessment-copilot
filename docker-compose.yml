version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_assessment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_assessment_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_assessment_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
